server:
  port: 9900
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ./uploads
    allowed-extensions: txt,md

milvus:
  host: localhost
  port: 19530
  username: ""
  password: ""
  database: default
  timeout: 10000

# Spring AI Alibaba DashScope 配置
spring:
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          timeout: 180000  # 超时时间180秒（3分钟）
      retry:
        max-attempts: 3  # 最大重试次数
        backoff:
          initial-interval: 2000  # 初始重试间隔2秒
          multiplier: 2  # 重试间隔倍数
          max-interval: 10000  # 最大重试间隔10秒
    
    # Spring AI MCP 客户端配置
    # 如果使用mock数据，请注释这部分内容
    mcp:
      client:
        enabled: true
        name: tencent-mcp-server
        version: 1.0.0
        request-timeout: 60s
        type: ASYNC
        sse:
          connections:
            tencent-cls:
              url: http://localhost:3000
              sse-endpoint: /sse # 完整的SSE端点路径

# 阿里云 DashScope Embedding API 配置
dashscope:
  api:
    key: ${DASHSCOPE_API_KEY:}
  embedding:
    model: text-embedding-v4  # 阿里云文本向量化模型

# 文档分片配置
document:
  chunk:
    max-size: 800  # 每个分片最大字符数
    overlap: 100   # 分片之间的重叠字符数

# RAG 配置
rag:
  top-k: 3  # 检索返回的最相似文档数量
  model: "qwen3.7-plus"  # 大语言模型名称

# 本机指标采集（供 Prometheus 抓取）
monitoring:
  collect-interval-ms: 15000

# 本地单机 checkpoint；生产环境必须覆盖签名密钥
checkpoint:
  enabled: true
  directory: ./runtime/checkpoints
  hmac-secret: ${CHECKPOINT_HMAC_SECRET:local-development-checkpoint-secret-change-me}
  max-failed-retries: 2
  recent-conversation-pairs: 6

# Actuator / Prometheus 指标暴露
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    prometheus:
      enabled: true

# Prometheus 配置
prometheus:
  base-url: http://localhost:9090
  timeout: 10  # 超时时间（秒）
  mock-enabled: false  # 真实模式：连接本地 Prometheus

# CLS 云日志服务配置（密钥与 TopicId 优先从 cls.env 读取）
cls:
  mock-enabled: false
  region: ap-guangzhou
  topic-id: ${CLS_TOPIC_ID:}
  secret-id: ${TENCENTCLOUD_SECRET_ID:}
  secret-key: ${TENCENTCLOUD_SECRET_KEY:}
  log-shipping:
    enabled: ${CLS_LOG_SHIPPING_ENABLED:true}
    interval-seconds: 60
    service-name: local-host  # 与 Prometheus 告警、日志中的 service 字段一致

diagnosis:
  projects-dir: config/projects
  default-mode: PLATFORM
  cross-project-expansion-enabled: true
  cross-project-retrieval-enabled: false
  demo-telemetry-enabled: true
  context:
    log-summary-threshold: 20
    metric-points-threshold: 30
    token-budget: 8000
    trim-keep-recent-steps: 3
    extra-prompt-hint-max-chars: 400
    business-field-max-chars: 800
  observability:
    enabled: true
    persist-prompt-body: false
    retain-hours: 24
  limits:
    max-duration-seconds: 120
    max-tool-calls: 20
    max-concurrent: 2
